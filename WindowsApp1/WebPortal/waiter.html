<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تطبيق الويتر المتنقل — سستمك Mobile POS</title>
  <meta name="theme-color" content="#0F172A">
  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: #141B2D;
      --card-border: #1F293D;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 90px;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #10B981, #3B82F6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
    }
    .selected-table-badge {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Table Bar */
    .tables-scroll {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      overflow-x: auto;
      white-space: nowrap;
    }
    .tbl-chip {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tbl-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .tbl-chip.occupied {
      border-color: var(--danger);
      color: #FCA5A5;
    }
    .tbl-chip.reserved {
      border-color: var(--warning);
      color: #FDE68A;
    }

    /* Category Bar */
    .cats-scroll {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .cat-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Search Box */
    .search-box {
      padding: 8px 14px;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      padding: 8px 14px;
    }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      cursor: pointer;
      position: relative;
    }
    .product-card:active {
      transform: scale(0.97);
    }
    .product-name {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .product-price {
      font-size: 14px;
      font-weight: 800;
      color: var(--success);
    }
    .product-badge-qty {
      position: absolute;
      top: -6px;
      left: -6px;
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg);
    }

    /* Floating Cart Bar */
    .floating-cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 60;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.3);
    }
    .cart-summary {
      display: flex;
      flex-direction: column;
    }
    .cart-total {
      font-size: 17px;
      font-weight: 800;
      color: var(--success);
    }
    .cart-count {
      font-size: 11px;
      color: var(--text-muted);
    }
    .btn-send-order {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-send-order:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    /* Cart Modal Sheet */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: flex-end;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-sheet {
      background: var(--card-bg);
      border-top: 2px solid var(--primary);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }
    .sheet-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--card-border);
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🍽️</div>
      <div>
        <div class="brand-title">سستمك للويتر</div>
      </div>
    </div>
    <div class="selected-table-badge" id="btnActiveTableBadge" onclick="showTablePicker()">
      <span id="lblSelectedTableName">اختر طاولة ▾</span>
    </div>
  </header>

  <!-- Table Selection Strip -->
  <div class="tables-scroll" id="tablesStrip">
    <!-- Populated dynamically -->
  </div>

  <!-- Category Filter Strip -->
  <div class="cats-scroll" id="catsStrip">
    <button class="cat-btn active" onclick="filterCategory(0, this)">الكل</button>
  </div>

  <!-- Search Input -->
  <div class="search-box">
    <input type="text" id="txtSearch" class="search-input" placeholder="🔍 ابحث عن صنف أو مشروب..." oninput="handleSearch(this.value)">
  </div>

  <!-- Products Grid -->
  <div class="products-grid" id="productsGrid">
    <!-- Populated dynamically -->
  </div>

  <!-- Floating Cart Bar -->
  <div class="floating-cart-bar">
    <div class="cart-summary" onclick="openCartModal()">
      <span class="cart-total" id="lblCartTotal">0.00 ج.م</span>
      <span class="cart-count" id="lblCartCount">0 أصناف مختارة (انقر للمعاينة)</span>
    </div>
    <button class="btn-send-order" id="btnSendOrder" onclick="submitWaiterOrder()" disabled>
      <span>🚀 إرسال للمطبخ</span>
    </button>
  </div>

  <!-- Cart Modal Sheet -->
  <div class="modal-backdrop" id="cartModal" onclick="if(event.target===this) closeCartModal()">
    <div class="modal-sheet">
      <div class="sheet-title">
        <span id="lblModalTitle">سلة طلبات الطاولة</span>
        <button onclick="closeCartModal()" style="background:transparent; border:none; color:var(--text-muted); font-size:18px; cursor:pointer;">✕</button>
      </div>

      <div style="margin-bottom: 12px;">
        <input type="text" id="txtWaiterName" class="search-input" placeholder="اسم الويتر (اختياري)..." style="margin-bottom: 6px;">
        <input type="text" id="txtOrderNotes" class="search-input" placeholder="ملاحظات المطبخ (تسوية، بدون بصل، سرعة)...">
      </div>

      <div id="cartItemsList" style="flex:1; overflow-y:auto; margin-bottom: 14px;">
        <!-- Cart items rendered here -->
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="btn-send-order" style="flex:1;" onclick="submitWaiterOrder()">
          <span>تأكيد وإرسال للمطبخ 🚀</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentTable = null;
    let menuData = [];
    let activeCategoryId = 0;
    let searchTerm = "";
    let cart = []; // { productId, productName, sizeId, sizeName, unitPrice, quantity, notes }

    async function init() {
      await loadTables();
      await loadMenu();
    }

    async function loadTables() {
      try {
        const res = await fetch('/api/tables');
        const tables = await res.json();
        const strip = document.getElementById('tablesStrip');
        strip.innerHTML = '';

        tables.forEach(t => {
          const chip = document.createElement('div');
          const isOccupied = (t.status === 2);
          const isReserved = (t.status === 3);
          chip.className = 'tbl-chip ' + (isOccupied ? 'occupied' : (isReserved ? 'reserved' : ''));
          chip.innerHTML = `
            <span>🪑 ${t.name || ('طاولة ' + t.number)}</span>
            <span style="font-size:10px;">${isOccupied ? ('(🔴 ' + Number(t.totalAmount||0).toFixed(0) + 'ج)') : (isReserved ? '🟡' : '🟢')}</span>
          `;
          chip.onclick = () => selectTable(t, chip);
          strip.appendChild(chip);

          if (!currentTable) {
            selectTable(t, chip);
          }
        });
      } catch (e) {
        console.error("Error loading tables", e);
      }
    }

    function selectTable(t, chipEl) {
      currentTable = t;
      document.querySelectorAll('.tbl-chip').forEach(c => c.classList.remove('active'));
      if (chipEl) chipEl.classList.add('active');
      document.getElementById('lblSelectedTableName').textContent = (t.name || ('طاولة ' + t.number));
      document.getElementById('lblModalTitle').textContent = `سلة طلبات ${t.name || ('طاولة ' + t.number)}`;
      updateCartUI();
    }

    function showTablePicker() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadMenu() {
      // 1. استرجاع سريع من الذاكرة المحلية (Offline Cache) فوراً
      try {
        const cached = localStorage.getItem('sestamk_waiter_menu');
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && parsed.length > 0) {
            menuData = parsed;
            renderCategoryBar();
            renderProducts();
          }
        }
      } catch (e) {}

      // 2. تحديث المنيو من السيرفر المحلي
      try {
        const res = await fetch('/api/menu');
        const json = await res.json();
        if (json.success && json.categories) {
          menuData = json.categories;
          localStorage.setItem('sestamk_waiter_menu', JSON.stringify(menuData));
          renderCategoryBar();
          renderProducts();
        }
      } catch (e) {
        console.error("Error loading menu", e);
      }
    }

    function renderCategoryBar() {
      const strip = document.getElementById('catsStrip');
      strip.innerHTML = '<button class="cat-btn active" onclick="filterCategory(0, this)">الكل</button>';
      menuData.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.textContent = c.name;
        btn.onclick = () => filterCategory(c.id, btn);
        strip.appendChild(btn);
      });
    }

    function filterCategory(catId, btn) {
      activeCategoryId = catId;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderProducts();
    }

    function handleSearch(val) {
      searchTerm = val.trim().toLowerCase();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      let items = [];
      menuData.forEach(cat => {
        if (activeCategoryId === 0 || cat.id === activeCategoryId) {
          cat.items.forEach(it => {
            if (!searchTerm || it.name.toLowerCase().includes(searchTerm) || (it.nameAr && it.nameAr.toLowerCase().includes(searchTerm))) {
              items.push(it);
            }
          });
        }
      });

      if (!items.length) {
        grid.innerHTML = '<div style="grid-column: 1/-1; padding: 30px; text-align:center; color:var(--text-muted)">لا توجد أصناف مطابقة.</div>';
        return;
      }

      items.forEach(it => {
        const card = document.createElement('div');
        card.className = 'product-card';

        // Check if item in cart
        const cartCount = cart.filter(c => c.productId === it.id).reduce((sum, c) => sum + c.quantity, 0);

        card.innerHTML = `
          ${cartCount > 0 ? `<div class="product-badge-qty">${cartCount}</div>` : ''}
          <div class="product-name">${it.nameAr || it.name}</div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="product-price">${Number(it.price).toFixed(2)} ج.م</span>
            <span style="font-size:18px;">➕</span>
          </div>
        `;
        card.onclick = () => addToCart(it);
        grid.appendChild(card);
      });
    }

    function addToCart(product) {
      // If product has sizes, pick default or prompt
      let sizeId = null;
      let sizeName = "";
      let price = product.price;

      if (product.sizes && product.sizes.length > 0) {
        sizeId = product.sizes[0].sizeId;
        sizeName = product.sizes[0].sizeName;
        price = product.sizes[0].price;
      }

      const existing = cart.find(c => c.productId === product.id && c.sizeId === sizeId);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          productId: product.id,
          productName: product.nameAr || product.name,
          sizeId: sizeId,
          sizeName: sizeName,
          unitPrice: price,
          quantity: 1,
          notes: ""
        });
      }
      updateCartUI();
      renderProducts();
    }

    function updateCartUI() {
      const totalCount = cart.reduce((sum, c) => sum + c.quantity, 0);
      const totalPrice = cart.reduce((sum, c) => sum + (c.unitPrice * c.quantity), 0);

      document.getElementById('lblCartCount').textContent = `${totalCount} أصناف في السلة (انقر للمعاينة)`;
      document.getElementById('lblCartTotal').textContent = `${totalPrice.toFixed(2)} ج.م`;

      const btnSend = document.getElementById('btnSendOrder');
      btnSend.disabled = (totalCount === 0 || !currentTable);

      renderCartItems();
    }

    function renderCartItems() {
      const container = document.getElementById('cartItemsList');
      container.innerHTML = '';

      if (!cart.length) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-muted)">السلة فارغة حالياً.</div>';
        return;
      }

      cart.forEach((it, idx) => {
        const row = document.createElement('div');
        row.className = 'cart-item-row';
        row.innerHTML = `
          <div>
            <div style="font-weight:700; font-size:14px;">${it.productName} ${it.sizeName ? `(${it.sizeName})` : ''}</div>
            <div style="font-size:12px; color:var(--success); font-weight:600;">${(it.unitPrice * it.quantity).toFixed(2)} ج.م (${Number(it.unitPrice).toFixed(2)} للوحدة)</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
            <span style="font-weight:700; min-width:20px; text-align:center;">${it.quantity}</span>
            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function changeQty(idx, delta) {
      if (cart[idx]) {
        cart[idx].quantity += delta;
        if (cart[idx].quantity <= 0) {
          cart.splice(idx, 1);
        }
      }
      updateCartUI();
      renderProducts();
    }

    function openCartModal() {
      if (!cart.length) return;
      document.getElementById('cartModal').classList.add('open');
    }

    function closeCartModal() {
      document.getElementById('cartModal').classList.remove('open');
    }

    async function submitWaiterOrder() {
      if (!currentTable || !cart.length) return;

      const btn = document.getElementById('btnSendOrder');
      btn.disabled = true;
      btn.textContent = "جاري الإرسال...";

      const payload = {
        tableId: currentTable.id,
        tableName: currentTable.name || ('طاولة ' + currentTable.number),
        waiterName: document.getElementById('txtWaiterName').value.trim() || "الويتر",
        notes: document.getElementById('txtOrderNotes').value.trim(),
        items: cart
      };

      try {
        const res = await fetch('/api/order/waiter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          alert(`✅ تم إرسال الطلب للمطبخ بنجاح!\nطاولة: ${payload.tableName}\nالإجمالي: ${Number(data.totalAdded).toFixed(2)} ج.م`);
          cart = [];
          closeCartModal();
          updateCartUI();
          renderProducts();
          loadTables();
        } else {
          alert("خطأ: " + (data.error || "تعذر إرسال الطلب"));
        }
      } catch (err) {
        alert("فشل الاتصال بسيرفر الكاشير: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "🚀 إرسال للمطبخ";
      }
    }

    init();
  </script>
</body>
</html>
