<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سستمك — تطبيق الويتر الذكي</title>
  <meta name="theme-color" content="#090D16">
  <style>
    :root {
      --bg: #090D16;
      --card-bg: #111827;
      --card-border: #1F2937;
      --surface: #1E293B;
      --text: #F9FAFB;
      --text-muted: #9CA3AF;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --success: #10B981;
      --success-dark: #059669;
      --danger: #EF4444;
      --warning: #F59E0B;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 95px;
      user-select: none;
    }

    /* Top Bar */
    header {
      background: rgba(17, 24, 39, 0.95);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3B82F6, #10B981);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }
    .table-badge-btn {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .table-badge-btn:active {
      transform: scale(0.96);
    }

    /* Tables Horizontal Bar */
    .section-label {
      padding: 10px 14px 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tables-scroll {
      display: flex;
      gap: 8px;
      padding: 6px 14px 10px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .tables-scroll::-webkit-scrollbar { display: none; }
    .tbl-chip {
      padding: 8px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 90px;
      transition: all 0.15s;
    }
    .tbl-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }
    .tbl-chip.occupied {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.08);
      color: #FCA5A5;
    }
    .tbl-chip.reserved {
      border-color: var(--warning);
      background: rgba(245, 158, 11, 0.08);
      color: #FDE68A;
    }

    /* Category Bar */
    .cats-scroll {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .cats-scroll::-webkit-scrollbar { display: none; }
    .cat-btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cat-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* Search Input */
    .search-box {
      padding: 6px 14px 10px;
    }
    .search-input-wrap {
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 12px 42px 12px 14px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
    }
    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--text-muted);
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      padding: 4px 14px 20px;
    }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 120px;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s, border-color 0.15s, box-shadow 0.15s;
      overflow: hidden;
    }
    .product-card:active {
      transform: scale(0.97);
    }
    .product-card.has-items {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.05);
    }
    .product-name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .product-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--success);
    }
    .product-add-btn {
      width: 32px;
      height: 32px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      border: 1px solid var(--primary);
    }
    .product-badge-qty {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--primary);
      color: #fff;
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.5);
    }

    /* Bottom Floating Cart Bar */
    .floating-cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(17, 24, 39, 0.98);
      border-top: 1px solid var(--card-border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 60;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.4);
      backdrop-filter: blur(16px);
    }
    .cart-summary {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .cart-total {
      font-size: 18px;
      font-weight: 800;
      color: var(--success);
    }
    .cart-count {
      font-size: 11px;
      color: var(--text-muted);
    }
    .btn-send-order {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    .btn-send-order:active {
      transform: scale(0.97);
    }
    .btn-send-order:disabled {
      background: #374151;
      color: #9CA3AF;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Modal Sheets */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: flex-end;
      backdrop-filter: blur(4px);
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-sheet {
      background: var(--card-bg);
      border-top: 2px solid var(--primary);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -12px 32px rgba(0,0,0,0.5);
    }
    .sheet-title {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--card-border);
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quick-notes {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .quick-note-chip {
      background: var(--surface);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 14px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .quick-note-chip:active {
      background: var(--primary);
    }
    .notification-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #059669;
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="toast" class="notification-toast">
    <span>✓</span>
    <span id="toastMsg">تم بنجاح</span>
  </div>

  <header>
    <div class="brand">
      <div class="brand-icon">🍽️</div>
      <div>
        <div class="brand-title">سستمك للويتر</div>
        <div class="brand-sub">نقطة بيع الصالة المتنقلة</div>
      </div>
    </div>
    <div class="table-badge-btn" id="btnActiveTableBadge" onclick="focusTables()">
      <span id="lblSelectedTableName">اختر طاولة ▾</span>
    </div>
  </header>

  <!-- Table Selection Strip -->
  <div class="section-label">طاولات الصالة اللحظية</div>
  <div class="tables-scroll" id="tablesStrip">
    <!-- Populated dynamically -->
  </div>

  <!-- Category Filter Strip -->
  <div class="cats-scroll" id="catsStrip">
    <button class="cat-btn active" onclick="filterCategory(0, this)">🌟 الكل</button>
  </div>

  <!-- Search Input -->
  <div class="search-box">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="txtSearch" class="search-input" placeholder="ابحث باسم الصنف أو المشروب..." oninput="handleSearch(this.value)">
    </div>
  </div>

  <!-- Products Grid -->
  <div class="products-grid" id="productsGrid">
    <!-- Populated dynamically -->
  </div>

  <!-- Floating Cart Bar -->
  <div class="floating-cart-bar">
    <div class="cart-summary" onclick="openCartModal()">
      <span class="cart-total" id="lblCartTotal">0.00 ج.م</span>
      <span class="cart-count" id="lblCartCount">0 أصناف في السلة (انقر للمعاينة)</span>
    </div>
    <button class="btn-send-order" id="btnSendOrder" onclick="submitWaiterOrder()" disabled>
      <span>🚀 إرسال للمطبخ</span>
    </button>
  </div>

  <!-- Cart Modal Sheet -->
  <div class="modal-backdrop" id="cartModal" onclick="if(event.target===this) closeCartModal()">
    <div class="modal-sheet">
      <div class="sheet-title">
        <span id="lblModalTitle">سلة طلبات الطاولة</span>
        <button onclick="closeCartModal()" style="background:transparent; border:none; color:var(--text-muted); font-size:22px; cursor:pointer;">✕</button>
      </div>

      <div style="margin-bottom: 14px;">
        <input type="text" id="txtWaiterName" class="search-input" placeholder="اسم الويتر (مثلاً: كريم)..." style="margin-bottom: 8px;">
        <div class="quick-notes">
          <span class="quick-note-chip" onclick="appendNote('بدون بصل')">🧅 بدون بصل</span>
          <span class="quick-note-chip" onclick="appendNote('تسوية زيادة')">🥩 تسوية زيادة</span>
          <span class="quick-note-chip" onclick="appendNote('حار / سبايسي')">🌶️ سبايسي</span>
          <span class="quick-note-chip" onclick="appendNote('سريع / مستعجل')">⚡ مستعجل</span>
          <span class="quick-note-chip" onclick="appendNote('بدون مخلل')">🥒 بدون مخلل</span>
        </div>
        <input type="text" id="txtOrderNotes" class="search-input" placeholder="ملاحظات المطبخ الإضافية...">
      </div>

      <div id="cartItemsList" style="flex:1; overflow-y:auto; margin-bottom: 16px;">
        <!-- Cart items rendered here -->
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="btn-send-order" style="flex:1; justify-content:center; padding:14px;" id="btnSubmitModal" onclick="submitWaiterOrder()">
          <span>تأكيد وإرسال للمطبخ والصالة 🚀</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin.startsWith('http') ? window.location.origin : 'http://' + (window.location.hostname || '127.0.0.1') + ':5055';
    let currentTable = null;
    let menuData = [];
    let activeCategoryId = 0;
    let searchTerm = "";
    let cart = [];

    function showToast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      el.style.display = 'flex';
      setTimeout(() => el.style.display = 'none', 3000);
    }

    function appendNote(note) {
      const input = document.getElementById('txtOrderNotes');
      input.value = input.value ? (input.value + ' - ' + note) : note;
    }

    async function init() {
      // Restore waiter name
      const savedWaiter = localStorage.getItem('sestamk_waiter_name');
      if (savedWaiter) document.getElementById('txtWaiterName').value = savedWaiter;

      await loadTables();
      await loadMenu();
    }

    async function loadTables() {
      try {
        const res = await fetch(API_BASE + '/api/tables');
        if (!res.ok) throw new Error();
        const tables = await res.json();
        const strip = document.getElementById('tablesStrip');
        strip.innerHTML = '';

        tables.forEach(t => {
          const chip = document.createElement('div');
          const isOccupied = (t.status === 2);
          const isReserved = (t.status === 3);
          chip.className = 'tbl-chip ' + (isOccupied ? 'occupied' : (isReserved ? 'reserved' : ''));
          chip.innerHTML = `
            <span>🪑 ${t.name || ('طاولة ' + t.number)}</span>
            <span style="font-size:10px; font-weight:600;">${isOccupied ? ('🔴 ' + Number(t.totalAmount||0).toFixed(0) + 'ج') : (isReserved ? '🟡 محجوزة' : '🟢 متاحة')}</span>
          `;
          chip.onclick = () => selectTable(t, chip);
          strip.appendChild(chip);

          if (!currentTable && t.status === 1) {
            selectTable(t, chip);
          }
        });
        if (!currentTable && tables.length > 0) {
          selectTable(tables[0], strip.firstChild);
        }
      } catch (e) {
        console.error("Error loading tables", e);
      }
    }

    function selectTable(t, chipEl) {
      currentTable = t;
      document.querySelectorAll('.tbl-chip').forEach(c => c.classList.remove('active'));
      if (chipEl) chipEl.classList.add('active');
      document.getElementById('lblSelectedTableName').textContent = (t.name || ('طاولة ' + t.number));
      document.getElementById('lblModalTitle').textContent = `سلة طلبات ${t.name || ('طاولة ' + t.number)}`;
      updateCartUI();
    }

    function focusTables() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadMenu() {
      // Offline-first instant render from cache
      try {
        const cached = localStorage.getItem('sestamk_waiter_menu');
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && parsed.length > 0) {
            menuData = parsed;
            renderCategoryBar();
            renderProducts();
          }
        }
      } catch (e) {}

      // Refresh from local API
      try {
        const res = await fetch(API_BASE + '/api/menu');
        if (!res.ok) throw new Error();
        const json = await res.json();
        if (json.success && json.categories) {
          menuData = json.categories;
          localStorage.setItem('sestamk_waiter_menu', JSON.stringify(menuData));
          renderCategoryBar();
          renderProducts();
        }
      } catch (e) {
        console.error("Error loading menu", e);
      }
    }

    function renderCategoryBar() {
      const strip = document.getElementById('catsStrip');
      strip.innerHTML = '<button class="cat-btn active" onclick="filterCategory(0, this)">🌟 الكل</button>';
      menuData.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.textContent = c.name;
        btn.onclick = () => filterCategory(c.id, btn);
        strip.appendChild(btn);
      });
    }

    function filterCategory(catId, btn) {
      activeCategoryId = catId;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderProducts();
    }

    function handleSearch(val) {
      searchTerm = val.trim().toLowerCase();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      let items = [];
      menuData.forEach(cat => {
        if (activeCategoryId === 0 || cat.id === activeCategoryId) {
          cat.items.forEach(it => {
            if (!searchTerm || it.name.toLowerCase().includes(searchTerm) || (it.nameAr && it.nameAr.toLowerCase().includes(searchTerm))) {
              items.push(it);
            }
          });
        }
      });

      if (!items.length) {
        grid.innerHTML = '<div style="grid-column: 1/-1; padding: 40px; text-align:center; color:var(--text-muted); font-size:14px;">🍽️ لا توجد أصناف مطابقة للبحث.</div>';
        return;
      }

      items.forEach(it => {
        const card = document.createElement('div');
        const cartCount = cart.filter(c => c.productId === it.id).reduce((sum, c) => sum + c.quantity, 0);
        card.className = 'product-card ' + (cartCount > 0 ? 'has-items' : '');

        card.innerHTML = `
          ${cartCount > 0 ? `<div class="product-badge-qty">${cartCount}</div>` : ''}
          <div class="product-name">${it.nameAr || it.name}</div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
            <span class="product-price">${Number(it.price).toFixed(2)} ج.م</span>
            <div class="product-add-btn">＋</div>
          </div>
        `;
        card.onclick = () => addToCart(it);
        grid.appendChild(card);
      });
    }

    function addToCart(product) {
      let sizeId = null;
      let sizeName = "";
      let price = product.price;

      if (product.sizes && product.sizes.length > 0) {
        sizeId = product.sizes[0].sizeId;
        sizeName = product.sizes[0].sizeName;
        price = product.sizes[0].price;
      }

      const existing = cart.find(c => c.productId === product.id && c.sizeId === sizeId);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          productId: product.id,
          productName: product.nameAr || product.name,
          sizeId: sizeId,
          sizeName: sizeName,
          unitPrice: price,
          quantity: 1,
          notes: ""
        });
      }
      updateCartUI();
      renderProducts();
    }

    function updateCartUI() {
      const totalCount = cart.reduce((sum, c) => sum + c.quantity, 0);
      const totalPrice = cart.reduce((sum, c) => sum + (c.unitPrice * c.quantity), 0);

      document.getElementById('lblCartCount').textContent = `${totalCount} أصناف مختارة (انقر للمعاينة والتأكيد)`;
      document.getElementById('lblCartTotal').textContent = `${totalPrice.toFixed(2)} ج.م`;

      const btnSend = document.getElementById('btnSendOrder');
      btnSend.disabled = (totalCount === 0 || !currentTable);

      renderCartItems();
    }

    function renderCartItems() {
      const container = document.getElementById('cartItemsList');
      container.innerHTML = '';

      if (!cart.length) {
        container.innerHTML = '<div style="padding:30px; text-align:center; color:var(--text-muted)">السلة فارغة حالياً.</div>';
        return;
      }

      cart.forEach((it, idx) => {
        const row = document.createElement('div');
        row.className = 'cart-item-row';
        row.innerHTML = `
          <div>
            <div style="font-weight:700; font-size:14px;">${it.productName} ${it.sizeName ? `(${it.sizeName})` : ''}</div>
            <div style="font-size:12px; color:var(--success); font-weight:700;">${(it.unitPrice * it.quantity).toFixed(2)} ج.م (${Number(it.unitPrice).toFixed(2)} للوحدة)</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
            <span style="font-weight:800; min-width:24px; text-align:center; font-size:15px;">${it.quantity}</span>
            <button class="qty-btn" onclick="changeQty(${idx}, 1)">＋</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function changeQty(idx, delta) {
      if (cart[idx]) {
        cart[idx].quantity += delta;
        if (cart[idx].quantity <= 0) {
          cart.splice(idx, 1);
        }
      }
      updateCartUI();
      renderProducts();
    }

    function openCartModal() {
      if (!cart.length) return;
      document.getElementById('cartModal').classList.add('open');
    }

    function closeCartModal() {
      document.getElementById('cartModal').classList.remove('open');
    }

    async function submitWaiterOrder() {
      if (!currentTable || !cart.length) return;

      const btnBottom = document.getElementById('btnSendOrder');
      const btnModal = document.getElementById('btnSubmitModal');
      btnBottom.disabled = true;
      btnModal.disabled = true;
      btnBottom.textContent = "جاري الإرسال...";
      btnModal.textContent = "جاري الإرسال...";

      const waiterVal = document.getElementById('txtWaiterName').value.trim() || "الويتر";
      localStorage.setItem('sestamk_waiter_name', waiterVal);

      const payload = {
        tableId: currentTable.id,
        tableName: currentTable.name || ('طاولة ' + currentTable.number),
        waiterName: waiterVal,
        notes: document.getElementById('txtOrderNotes').value.trim(),
        items: cart
      };

      try {
        const res = await fetch(API_BASE + '/api/order/waiter', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json; charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          throw new Error(`خطأ في استجابة السيرفر (${res.status})`);
        }

        const data = await res.json();
        if (data.success) {
          showToast(`✓ تم إرسال الطلب للمطبخ بنجاح (${payload.tableName})`);
          cart = [];
          document.getElementById('txtOrderNotes').value = '';
          closeCartModal();
          updateCartUI();
          renderProducts();
          loadTables();
        } else {
          alert("تنبيه: " + (data.error || "تعذر تسجيل الطلب"));
        }
      } catch (err) {
        alert("فشل الاتصال بسيرفر الكاشير: " + err.message + "\nتأكد أن برنامج سستمك يعمل على الجهاز الرئيسي.");
      } finally {
        btnBottom.disabled = false;
        btnModal.disabled = false;
        btnBottom.innerHTML = "<span>🚀 إرسال للمطبخ</span>";
        btnModal.innerHTML = "<span>تأكيد وإرسال للمطبخ والصالة 🚀</span>";
      }
    }

    init();
  </script>
</body>
</html>
