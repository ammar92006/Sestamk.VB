<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سستمك — شاشة المطبخ الذكية (KDS)</title>
  <meta name="theme-color" content="#030712">
  <style>
    :root {
      --bg: #030712;
      --card-bg: #0F172A;
      --card-border: #1E293B;
      --surface: #1E293B;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --green: #10B981;
      --green-dark: #064E3B;
      --amber: #F59E0B;
      --amber-dark: #78350F;
      --red: #EF4444;
      --red-dark: #7F1D1D;
      --blue: #3B82F6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header Bar */
    header {
      background: #0B0F19;
      border-bottom: 2px solid var(--card-border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .kds-brand {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .kds-tag {
      background: var(--blue);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .stats-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .stat-badge {
      background: var(--surface);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .clock-badge {
      font-family: monospace;
      font-size: 20px;
      font-weight: 900;
      color: var(--blue);
      background: rgba(59, 130, 246, 0.1);
      padding: 4px 12px;
      border-radius: 8px;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    /* Actions Bar */
    .btn-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.15s;
    }
    .btn-header:active {
      transform: scale(0.96);
    }
    .btn-header.active {
      background: var(--blue);
      border-color: var(--blue);
    }

    /* Main Container */
    .kds-container {
      flex: 1;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
      align-content: start;
    }

    /* Order Card */
    .order-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.15s, border-color 0.2s;
    }
    .order-card.normal { border-color: var(--green); }
    .order-card.warning { border-color: var(--amber); }
    .order-card.overdue {
      border-color: var(--red);
      animation: alertPulse 1.8s infinite;
    }
    @keyframes alertPulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .card-head {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }
    .normal .card-head { background: var(--green-dark); }
    .warning .card-head { background: var(--amber-dark); }
    .overdue .card-head { background: var(--red-dark); }

    .order-meta-title {
      font-size: 17px;
      font-weight: 900;
    }
    .order-meta-sub {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 2px;
    }
    .timer-pill {
      background: rgba(0,0,0,0.4);
      padding: 6px 12px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 18px;
      font-weight: 900;
    }

    .card-body {
      padding: 14px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .kds-item-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .kds-item-row:hover {
      background: rgba(255,255,255,0.06);
    }
    .kds-item-row.done {
      opacity: 0.35;
      text-decoration: line-through;
      background: rgba(16, 185, 129, 0.05);
      border-color: rgba(16, 185, 129, 0.2);
    }
    .item-qty {
      font-size: 18px;
      font-weight: 900;
      color: var(--blue);
      min-width: 36px;
    }
    .item-info {
      flex: 1;
    }
    .item-name {
      font-size: 16px;
      font-weight: 800;
    }
    .item-notes {
      font-size: 13px;
      color: var(--amber);
      margin-top: 3px;
      font-weight: 700;
    }
    .item-check {
      font-size: 18px;
      font-weight: 800;
      color: var(--green);
    }

    .card-notes {
      background: rgba(245, 158, 11, 0.12);
      border: 1px dashed var(--amber);
      color: var(--amber);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 4px;
    }

    .card-footer {
      padding: 12px 16px;
      background: #0B0F19;
      border-top: 1px solid var(--card-border);
      display: flex;
      gap: 10px;
    }
    .btn-bump {
      flex: 1;
      background: linear-gradient(135deg, #10B981, #059669);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-bump:active {
      transform: scale(0.97);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 100px 20px;
      text-align: center;
      color: var(--muted);
    }
    .empty-icon {
      font-size: 72px;
      margin-bottom: 16px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="kds-brand">
        <span>🧑‍🍳 شاشة المطبخ الذكية</span>
        <span class="kds-tag">KDS LIVE</span>
      </div>
      <div class="stats-bar">
        <div class="stat-badge">
          <span>الطلبات النشطة:</span>
          <span id="lblActiveCount" style="color:var(--blue); font-size:15px;">0</span>
        </div>
        <div class="stat-badge">
          <span>المتأخرة (>18د):</span>
          <span id="lblOverdueCount" style="color:var(--red); font-size:15px;">0</span>
        </div>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:12px;">
      <button onclick="toggleAudio()" id="btnAudioToggle" class="btn-header">
        🔔 الصوت: مفعّل
      </button>
      <button onclick="playBeep()" class="btn-header">
        🔊 اختبار الصوت
      </button>
      <button onclick="toggleFullscreen()" class="btn-header">
        🗖 ملء الشاشة
      </button>
      <div class="clock-badge" id="lblClock">--:--:--</div>
    </div>
  </header>

  <main class="kds-container" id="ordersGrid">
    <!-- Order cards rendered dynamically -->
  </main>

  <script>
    const API_BASE = window.location.origin.startsWith('http') ? window.location.origin : 'http://' + (window.location.hostname || '127.0.0.1') + ':5055';
    let activeOrders = [];
    let audioEnabled = true;
    let knownOrderIds = new Set();
    let audioCtx = null;

    function playBeep() {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now); // A5
        osc.frequency.setValueAtTime(1174.66, now + 0.12); // D6
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

        osc.start(now);
        osc.stop(now + 0.45);
      } catch (e) {}
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('btnAudioToggle').textContent = audioEnabled ? "🔔 الصوت: مفعّل" : "🔕 الصوت: صامت";
      if (audioEnabled) playBeep();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen().catch(()=>{});
      }
    }

    function updateClock() {
      document.getElementById('lblClock').textContent = new Date().toLocaleTimeString('ar-EG');
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchOrders() {
      try {
        const res = await fetch(API_BASE + '/api/kds/orders');
        if (!res.ok) return;
        const data = await res.json();

        let hasNew = false;
        data.forEach(o => {
          if (!knownOrderIds.has(o.orderId)) {
            hasNew = true;
            knownOrderIds.add(o.orderId);
          }
        });

        if (hasNew && knownOrderIds.size > data.length) {
          playBeep();
        }

        activeOrders = data;
        renderOrders();
      } catch (e) {
        console.error("KDS fetch error", e);
      }
    }

    function renderOrders() {
      const grid = document.getElementById('ordersGrid');
      grid.innerHTML = '';

      let overdueCount = 0;
      document.getElementById('lblActiveCount').textContent = activeOrders.length;

      if (!activeOrders.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">✨</div>
            <h2 style="font-size:26px; font-weight:900; margin-bottom:8px;">كل الأوردرات منجزة بنجاح!</h2>
            <p style="font-size:15px;">المطبخ جاهز وفي انتظار استقبال طلبات جديدة من الكاشير أو الويتر...</p>
          </div>
        `;
        document.getElementById('lblOverdueCount').textContent = 0;
        return;
      }

      activeOrders.forEach(o => {
        const elapsedSec = o.elapsedSeconds || 0;
        const elapsedMin = Math.floor(elapsedSec / 60);

        let agingClass = 'normal';
        if (elapsedMin >= 18) {
          agingClass = 'overdue';
          overdueCount++;
        } else if (elapsedMin >= 10) {
          agingClass = 'warning';
        }

        const card = document.createElement('div');
        card.className = `order-card ${agingClass}`;

        const itemsHtml = (o.items || []).map(it => `
          <div class="kds-item-row ${it.isCompleted ? 'done' : ''}" onclick="toggleItemDone(${o.orderId}, ${it.detailId}, ${!it.isCompleted})">
            <span class="item-qty">${it.quantity}×</span>
            <div class="item-info">
              <div class="item-name">${it.productName} ${it.sizeName ? `(${it.sizeName})` : ''}</div>
              ${it.addonsText ? `<div style="font-size:12px; color:#38BDF8; font-weight:700;">+ ${it.addonsText}</div>` : ''}
              ${it.notes ? `<div class="item-notes">📝 ${it.notes}</div>` : ''}
            </div>
            <span class="item-check">${it.isCompleted ? '✓' : '○'}</span>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="card-head">
            <div>
              <div class="order-meta-title">طلب #${o.orderNumber} (${o.orderTypeDisplay || 'صالة'})</div>
              <div class="order-meta-sub">${o.serverName ? `الويتر: ${o.serverName}` : ''} ${o.tableName ? `• ${o.tableName}` : ''}</div>
            </div>
            <div class="timer-pill">${o.elapsedFormatted || (elapsedMin + ' د')}</div>
          </div>
          <div class="card-body">
            ${o.notes ? `<div class="card-notes">⚠️ ${o.notes}</div>` : ''}
            ${itemsHtml}
          </div>
          <div class="card-footer">
            <button class="btn-bump" onclick="bumpOrder(${o.orderId})">
              <span>✅ إنجاز الطلب كامل (BUMP)</span>
            </button>
          </div>
        `;

        grid.appendChild(card);
      });

      document.getElementById('lblOverdueCount').textContent = overdueCount;
    }

    async function toggleItemDone(orderId, detailId, isDone) {
      try {
        await fetch(API_BASE + '/api/kds/bump', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId: orderId, detailId: detailId, isCompleted: isDone, action: 'item' })
        });
        fetchOrders();
      } catch (e) {}
    }

    async function bumpOrder(orderId) {
      try {
        await fetch(API_BASE + '/api/kds/bump', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId: orderId, action: 'bump' })
        });
        knownOrderIds.delete(orderId);
        fetchOrders();
      } catch (e) {}
    }

    // Refresh every 3 seconds
    fetchOrders();
    setInterval(fetchOrders, 3000);
  </script>
</body>
</html>
